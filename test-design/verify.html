<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMS kod — Sola Kabinet</title>
<meta name="theme-color" content="#eff1f3">
<link rel="icon" href="assets/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">

<!-- Saqlangan tanlovlar stildan OLDIN qo'yiladi, aks holda tizimi qorong'i
     bo'lgan foydalanuvchi avval oq sahifani ko'rib, keyin qorayadi; matn
     hajmi esa sahifa yuklangach sakrab kattalashadi.
     Hech narsa saqlanmagan bo'lsa atribut umuman qo'yilmaydi — "tizim
     bo'yicha" va "oddiy hajm" haqiqiy standart holat bo'lib qoladi. -->
<script>
    (() => {
        const t = localStorage.getItem('sola-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);

        const s = localStorage.getItem('sola-text');
        if (s === 'lg' || s === 'xl') document.documentElement.setAttribute('data-text', s);
    })();
</script>

<script src="assets/tokens.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-dvh">
<script src="assets/icons.js"></script>

<a href="#content"
   class="sr-only z-[80] focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:rounded-full focus:border-2 focus:border-action focus:bg-surface focus:px-5 focus:py-3 focus:text-base focus:font-semibold focus:text-ink">
    Asosiy qismga o'tish
</a>

<div class="mx-auto flex min-h-dvh w-full max-w-[28rem] flex-col justify-center px-4 py-10">

    <!-- relative z-20: u-rise opacity/transform ni animatsiya qiladi, ya'ni bu
         qator o'z stacking kontekstini yaratadi va ichidagi "Ko'rinish" panelining
         z-50 i shu kontekstdan tashqariga chiqa olmaydi. Kontekst z-index siz
         qolsa, keyinroq turgan (u ham u-rise li) karta panelni bosib qoladi. -->
    <div class="u-rise relative z-20 mb-6 flex flex-wrap items-center justify-between gap-3">
        <span class="u-logo">
                        <img src="assets/logo-wordmark.png" alt="Sola" width="164" height="52"
                             class="hidden h-10 w-auto sm:block">
                        <img src="assets/logo-bird.png" alt="Sola" width="131" height="112"
                             class="h-10 w-auto sm:hidden">
                    </span>
        <div data-view-mount></div>
    </div>

    <main id="content">

        <!-- KOD KATAKCHALARI ------------------------------------------------
             Bitta uzun maydon o'rniga to'rtta katakcha: abonent nechta raqam
             kiritganini sanamasdan ko'radi, xato holatda esa qaysi joyda
             to'xtaganini biladi.

             Kirish uchun baribir BITTA <input> ishlatiladi — u shaffof qilib
             katakchalar ustiga qo'yiladi. Sabab: to'rtta alohida input SMS
             avtoto'ldirishni (autocomplete="one-time-code") buzadi va ekran
             o'quvchi uchun "4 ta alohida maydon" bo'lib qoladi. Katakchalar
             esa aria-hidden — ular bezak, ma'no inputda.
        -->
        <div class="u-card u-rise p-6 sm:p-7" style="--i:1">
            <h1 class="u-display text-2xl text-ink">Kirish kodini yozing</h1>
            <p class="mt-3 text-base text-muted">
                Tasdiqlash kodi <span class="font-semibold text-ink">******4567</span> raqamiga yuborildi.
            </p>

            <form method="post" action="accounts.html" class="mt-7" novalidate>
                <div class="relative">
                    <label for="code" class="sr-only">To'rt xonali kirish kodi</label>

                    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                           maxlength="4" data-code-input
                           class="absolute inset-0 z-10 w-full bg-transparent text-transparent caret-transparent outline-none"
                           style="font-size: 1px">

                    <div class="u-code" aria-hidden="true">
                        <span class="u-code-slot" data-code-slot data-filled="false"></span>
                        <span class="u-code-slot" data-code-slot data-filled="false"></span>
                        <span class="u-code-slot" data-code-slot data-filled="false"></span>
                        <span class="u-code-slot" data-code-slot data-filled="false"></span>
                    </div>
                </div>

                <p class="mt-4 text-center text-sm text-muted" data-code-hint>
                    Kod SMS orqali keldi — 4 ta raqam.
                </p>

                <button type="submit" class="u-btn-primary mt-6 w-full text-lg">Kabinetga kirish</button>
            </form>

            <div class="mt-4 flex flex-col gap-1">
                <button type="button"
                        class="flex min-h-[3rem] w-full items-center justify-center rounded-full text-base font-semibold text-action transition-colors hover:bg-surface-2">
                    Kod kelmadimi? Qayta yuborish
                </button>

                <a href="login.html"
                   class="flex min-h-[3rem] w-full items-center justify-center rounded-full text-base font-semibold text-muted no-underline transition-colors hover:bg-surface-2">
                    Raqamni o'zgartirish
                </a>
            </div>
        </div>

    </main>
</div>

<script src="assets/app.js"></script>
</body>
</html>
